  <path d="M 92 165 L 92 365 M 92 205 L 102 215 M 92 265 L 102 275 M 92 315 L 102 325 M 328 190 L 328 250" stroke="#80E5FF" stroke-width="2.5" stroke-linecap="round" />

  <!-- G Orbit / Loop Structure -->
  <path d="M 330 200 C 430 175 480 255 450 330 C 420 405 280 415 220 365 C 195 345 210 310 250 300 L 360 300 L 360 335 L 275 335 C 265 335 260 345 275 352 C 320 375 395 370 415 320 C 435 270 395 215 320 228 Z" fill="url(#blueGrad2)" stroke="#00D2FF" stroke-width="2.5" />

  <!-- Swoosh Orbit Ring Wrap -->
  <path d="M 45 320 C 25 355 115 385 225 365 C 335 345 475 285 475 220 C 475 180 385 180 335 195 C 295 205 355 175 415 165 C 485 155 505 210 455 255 C 395 305 240 375 105 380 C 55 382 35 345 60 320 Z" fill="url(#swooshGrad)" filter="url(#glow)" />
  <path d="M 55 330 C 130 370 260 360 440 240" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.9" stroke-linecap="round" />
