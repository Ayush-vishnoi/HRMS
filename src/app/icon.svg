  <path d="M 75 385 L 75 125 L 210 285 L 345 125 L 345 275 L 310 275 L 310 175 L 210 295 L 110 175 L 110 385 Z" fill="url(#blueGrad1)" stroke="#00D2FF" stroke-width="3" />
  
